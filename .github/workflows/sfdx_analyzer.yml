# .github/workflows/run-analyzer.yml

name: Run Salesforce Org Analyzer (Manual Org Input)

# This allows you to manually trigger the workflow from the GitHub Actions tab
on:
  workflow_dispatch:
    inputs:
      salesforce_username:
        description: 'Salesforce Username (pre-authorized for the Connected App)'
        required: true
        type: string
      salesforce_password:
        description: 'Salesforce Password (pre-authorized for the Connected App)'
        required: true
        type: string
      salesforce_client_id:
        description: 'Salesforce Connected App Consumer Key (Client ID)'
        required: true
        type: string

jobs:
  run-analysis:
    runs-on: ubuntu-latest
    name: Trigger and Monitor SFDX Analysis

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: 1. Start Analysis and Get Job ID
        id: start_job
        run: |
          echo "Sending request to start analysis..."
          
          # Create a temporary file to hold the JSON body.
          # It combines user inputs with secure secrets.
          cat <<EOF > request_body.json
          {
            "salesforce_creds": {
              "username": "${{ github.event.inputs.salesforce_username }}",
              "client_id": "${{ github.event.inputs.salesforce_client_id }}",
              "password": "${{ github.event.inputs.salesforce_password }}"
            }
          }
          EOF
          
          # Make the initial POST request using the file as the data source
          curl --request POST \
            --url "${{ secrets.APIM_ENDPOINT_URL }}" \
            --header 'Content-Type: application/json' \
            --header 'Ocp-Apim-Subscription-Key: ${{ secrets.APIM_SUBSCRIPTION_KEY }}' \
            --data @request_body.json \
            --fail --show-error --silent \
            > response.json

          # Check if the curl command was successful
          if [ $? -ne 0 ]; then
            echo "::error::Failed to start analysis job. The initial POST request failed."
            exit 1
          fi

          # Parse the status URI from the response
          STATUS_URI=$(jq -r .statusQueryGetUri response.json)
          if [ -z "$STATUS_URI" ] || [ "$STATUS_URI" == "null" ]; then
            echo "::error::Could not find 'statusQueryGetUri' in the server response. Check API Gateway and Function App logs."
            cat response.json
            exit 1
          fi
          
          echo "Job started successfully. Polling status at: $STATUS_URI"
          echo "status_uri=$STATUS_URI" >> $GITHUB_OUTPUT

      - name: 2. Poll for Job Completion
        id: poll_job
        # This step remains the same as before
        run: |
          STATUS_URI="${{ steps.start_job.outputs.status_uri }}"
          COUNTER=0
          MAX_RETRIES=60 # 30 minutes timeout

          while [ $COUNTER -lt $MAX_RETRIES ]; do
            curl -s "$STATUS_URI" > status_response.json
            RUNTIME_STATUS=$(jq -r .runtimeStatus status_response.json)
            echo "Polling... Current status: $RUNTIME_STATUS"
            if [[ "$RUNTIME_STATUS" == "Completed" || "$RUNTIME_STATUS" == "Failed" || "$RUNTIME_STATUS" == "Terminated" ]]; then
              echo "Job has finished with status: $RUNTIME_STATUS"
              break
            fi
            COUNTER=$((COUNTER+1))
            sleep 30
          done

          if [ $COUNTER -ge $MAX_RETRIES ]; then
            echo "::error::Job timed out after 30 minutes."
            exit 1
          fi

      - name: 3. Process Final Result
        # This step remains the same as before
        run: |
          FINAL_STATUS=$(jq -r .runtimeStatus status_response.json)
          if [ "$FINAL_STATUS" == "Completed" ]; then
            REPORT_URL=$(jq -r .output.report_url status_response.json)
            echo "✅ Analysis complete!"
            echo "=================================================="
            echo "Your report is ready."
            echo "Download URL (valid for 1 hour): $REPORT_URL"
            echo "=================================================="
          else
            ERROR_MESSAGE=$(jq -r .output status_response.json)
            echo "::error::Analysis failed with status: $FINAL_STATUS"
            echo "Reason: $ERROR_MESSAGE"
            exit 1
          fi
