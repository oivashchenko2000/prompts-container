analysis_tasks:
  - id: APEX_REVIEW
    name: "Apex Architecture Review"
    prompt_file: "prompts/apex/p1_apex_review.prompt"
    metadata_types: ["ApexClass", "ApexTrigger"]

  - id: LWC_REVIEW
    name: "LWC Architecture Review"
    prompt_file: "prompts/lwc/p2_lwc_review.prompt"
    metadata_types: ["LightningComponentBundle"]

  - id: AUTOMATION_REVIEW
    name: "Flow Architecture Review"
    prompt_file: "prompts/automation/p3_automation_review.prompt"
    metadata_types: ["Flow", "FlowDefinition"]

synthesis_tasks:
  - id: AUTOMATION_OVERLAPS
    name: "Automation Overlaps Analysis"
    prompt_file: "prompts/synthesis/p4_automation_overlaps.prompt"

  - id: ARCHITECTURE_PATTERNS
    name: "Architecture Patterns and Anti-patterns Synthesis"
    prompt_file: "prompts/synthesis/p5_architecture_patterns.prompt"
    expected_output_schema:
      type: "object"
      properties:
        patterns_observed: { type: "array", items: { "type": "string" }}
        anti_patterns_observed: { type: "array", items: { "type": "string" }}
        architecture_gaps: { type: "array", items: { "type": "string" }}
      required: ["patterns_observed", "anti_patterns_observed"]

  - id: BUSINESS_PROCESS_VISION
    name: "High-Level Business Process Vision Synthesis"
    prompt_file: "prompts/synthesis/p6_business_process_vision.prompt"
    expected_output_schema:
      type: "object"
      properties:
        process_catalog: { type: "array", items: { "type": "object" }}
        current_vision_narratives: { type: "array", items: { "type": "string" }}
      required: ["process_catalog"]

  - id: FINAL_REPORT_ASSEMBLY
    name: "Final Report Assembly"
    prompt_file: "prompts/synthesis/p7_final_report_assembly.prompt"